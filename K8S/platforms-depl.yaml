apiVersion: apps/v1
kind: Deployment
metadata:
  name: platforms-depl
  namespace: platforms
  labels:
    app: platforms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platformservices
  template:
    metadata:
      labels:
        app: platformservices
    spec:
      containers:
        - name: platformservices
          image: binaryusage/platformservice:latest